<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INELCOM · Replanteo y Cierre de Centrales (Telefónica)</title>
<style>
/* Layout: cabecera fija con progreso, una sección por pantalla, tarjetas de campo, botones grandes abajo */
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#15212b; --muted:#5b6b78; --line:#d6dde3;
  --accent:#1f5f99; --accent-ink:#ffffff; --ok:#1d7a4b; --warn:#b36200; --bad:#b3261e;
  --pend:#e0a100; --soft:#e8f0f7;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --card:#18222a; --ink:#e8eef3; --muted:#9aaab6; --line:#2c3a45;
    --accent:#6fb0ea; --accent-ink:#0b1a26; --ok:#5fd09a; --warn:#f0b35a; --bad:#ff8a80;
    --pend:#e8b82e; --soft:#1d2f3d; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1519; --card:#18222a; --ink:#e8eef3; --muted:#9aaab6; --line:#2c3a45;
  --accent:#6fb0ea; --accent-ink:#0b1a26; --ok:#5fd09a; --warn:#f0b35a; --bad:#ff8a80;
  --pend:#e8b82e; --soft:#1d2f3d; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.cname{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.prog{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8;margin-left:4px}
.chip.done::before{content:"✓ ";color:var(--ok)}
.chip[aria-current="step"].done::before{color:var(--accent-ink)}
main{padding:14px 16px;max-width:720px;margin:0 auto}
.demo{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.demo b{color:var(--ink)}
details.opts{margin-top:6px}
details.opts summary{cursor:pointer;color:var(--accent);font-size:13px}
.optrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
h2{font-size:21px;margin:6px 0 4px}
.intro{color:var(--muted);font-size:14px;margin:0 0 14px}
h3.sub{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pend);border-radius:10px;padding:12px 12px 10px;margin-bottom:10px}
.card.done{border-left-color:var(--ok)}
.card.skipped{border-left-color:var(--warn)}
.lab{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;font-weight:600}
.ref{font-weight:500;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.help{margin-top:4px}
.help summary{cursor:pointer;color:var(--accent);font-size:13px}
.help p{margin:6px 0 2px;font-size:14px;color:var(--muted)}
.inp{display:flex;gap:8px;align-items:center;margin-top:8px}
input[type=text],input[type=date],textarea,select{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:46px}
textarea{min-height:84px;resize:vertical}
.unit{color:var(--muted);font-size:14px;min-width:34px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choice{flex:1 1 auto;min-width:84px;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;text-align:center;min-height:46px}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.skip{margin-top:8px;background:none;border:none;color:var(--muted);font-size:13px;padding:6px 0;cursor:pointer;text-decoration:underline}
.skipbox{margin-top:8px}
.skipbox .t{font-size:13px;color:var(--warn);font-weight:600;margin-bottom:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:600;min-height:48px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.addph{display:inline-flex;align-items:center;gap:6px}
input[type=file]{display:none}
.calc{background:var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.calc div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.calc b{font-variant-numeric:tabular-nums}
.calc .t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.tbl{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.row{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.row .rt{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.grid .full{grid-column:1/-1}
.rm{border:none;background:none;color:var(--bad);cursor:pointer;font-size:14px;padding:6px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;z-index:5;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
footer .btn{flex:1}
.pend{list-style:none;margin:0;padding:0}
.pend li{border:1px solid var(--line);background:var(--card);border-radius:8px;margin-bottom:6px}
.pend button{width:100%;text-align:left;background:none;border:none;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.pend .s{color:var(--muted);font-size:12px}
.office header .bar,.office header .prog,.office header .chips,.office footer{display:none}
.office body,body.office{padding-bottom:20px}
.modes{display:flex;gap:6px;margin:6px 0}
.mode{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-weight:600;font-size:14px}
.mode[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.alert{border:1px solid var(--warn);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.alert b{color:var(--warn)}
.newc{width:100%;margin:2px 0 4px;min-height:44px;border-color:var(--accent);color:var(--accent)}
.newc.sure{background:var(--bad);border-color:var(--bad);color:#fff}
.okbox{border:1px solid var(--ok);border-radius:10px;padding:12px;background:var(--card);margin:10px 0}
.okbox b{color:var(--ok)}
.sum{font-size:14px;width:100%;border-collapse:collapse}
.sum td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sum td:first-child{color:var(--muted);width:48%}
.msg{font-size:13px;color:var(--muted);margin-top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="h1">Replanteo de central</h1><span class="cname" id="cname"></span></div>
  <div class="modes" role="tablist"><button class="mode" data-mode="replanteo">Replanteo</button><button class="mode" data-mode="cierre">Cierre</button><button class="mode" data-mode="oficina">Oficina (PDF)</button></div><button class="btn newc" id="newc">＋ Nueva central</button>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <div class="prog"><span id="progtxt"></span><span id="progpend"></span></div>
  <nav class="chips" id="chips" aria-label="Secciones"></nav>
</header>
<main id="main"></main>
<footer>
  <button class="btn" id="prev">← Anterior</button>
  <button class="btn pri" id="next">Siguiente →</button>
</footer>

<script>
"use strict";
/* ============ Definición de la lista (Excel de Replanteo + Bitácora, en orden de campo) ============ */
const F=(type,id,label,o)=>Object.assign({type,id,label},o||{});
const H=(text)=>({type:'h',text});
const YN=['Sí','No'], YNN=['Sí','No','No sé'];

const STEPS_R=[
 {id:'central',title:'Central',intro:'Lo primero: saber de qué central hablan estas notas y qué dice Telefónica de ella.',fields:[
  F('text','nombre','Nombre o código de la central',{help:'Tal como sale en el cartel o en la orden de trabajo. Si dudas, pregunta a oficina.'}),
  F('photo','ph_cartel','Foto del cartel o fachada con el nombre',{help:'Que se lea el nombre, para no mezclar fotos de centrales distintas.'}),
  F('text','direccion','Dirección'),
  F('date','fecha','Fecha de la visita'),
  F('text','quien','Quién hace la visita'),
  F('text','btp','Número de BTP',{help:'Viene en la orden de trabajo de Telefónica.'}),
  H('Lo que dice Telefónica (orientativo: hay que comprobarlo)'),
  F('num','tel_autonomia','Autonomía que da Telefónica',{unit:'h',help:'Apunta lo que dice el dato de Telefónica, aunque luego veas otra cosa en la central.'}),
  F('num','tel_antig','Antigüedad que da Telefónica',{unit:'años'}),

  F('num','tel_pot','Potencia del cuadro según Telefónica',{unit:'kW'}),
 ]},

  F('photo','ph_entrada','Foto de la entrada del edificio y de dónde aparcar'),
  F('photo','ph_recorrido','Foto del recorrido hasta la sala: escaleras, pasillos y puertas',{}),
  F('choice','planta','Planta de la sala',{options:['Baja','Sótano','Planta alta']}),
  F('choice','ascensor','Ascensor, montacargas o polipasto',{options:YN}),
  F('num','ancho_puerta','Ancho de la puerta más estrecha del recorrido',{unit:'m',help:'Mídelo con la cinta métrica. Es la puerta más estrecha de todo el camino.'}),
  F('num','dist_aparc','Distancia del aparcamiento a la sala',{unit:'m'}),
  F('choice','carretilla','¿Harán falta carretilla, plataforma o grúa?',{options:YNN}),
 ]},
 {id:'cgbt',title:'CGBT (cuadro de entrada)',intro:'El CGBT es el cuadro de baja tensión del que sale la alimentación al cuadro de fuerza. Mide solo con el cuadro abierto y sin tocar partes con tensión. Si algo parece peligroso, no lo toques y avisa.',fields:[
  F('photo','ph_cgbt','Foto del CGBT completo, de frente y con la puerta abierta',{help:'Si no sabes dónde está, anota dónde lo has encontrado y haz foto de la ubicación.'}),
  F('photo','ph_prot','Foto de las protecciones que alimentan al cuadro de fuerza, con los calibres legibles',{}),
  F('photo','ph_tierra','Foto del punto de puesta a tierra',{}),
  F('photo','ph_display','Foto del display del CGBT con el consumo (si tiene)'),
  F('choice','reconectadora','¿Hay reconectadora de alterna en el CGBT?',{options:YNN,ref:'Pedido por INELCOM',noSkip:true,help:'Obligatorio en todas las centrales. Telefónica quiere que funcionen todas; lo pide INELCOM, no viene en el pliego. Si hay, haz foto con el modelo legible.'}),
  F('photo','ph_recon','Foto de la reconectadora con el modelo legible',{showIf:v=>v.reconectadora==='Sí'}),
  F('text','recon_modelo','Marca y modelo de la reconectadora',{showIf:v=>v.reconectadora==='Sí'}),
  F('choice','recon_func','¿La reconectadora funciona?',{options:YNN,ref:'Pedido por INELCOM',noSkip:true,showIf:v=>v.reconectadora==='Sí',help:'Anota lo que veas (pantalla, luces, estado). Si no puedes comprobarlo, pon «No sé» y explica por qué en las notas.'}),
  F('choice','recon_alarma','¿La reconectadora tiene alarma?',{options:YNN,ref:'Pedido por INELCOM',noSkip:true,showIf:v=>v.reconectadora==='Sí',help:'Telefónica pide que tenga alarma. Si no lo ves claro, pon «No sé» y haz la foto del panel.'}),
  F('choice','recon_485','¿La reconectadora tiene conexión RS485?',{options:YNN,ref:'Pedido por INELCOM',noSkip:true,showIf:v=>v.reconectadora==='Sí',help:'Telefónica pide conexión RS485. Mira si tiene un puerto o unos bornes marcados RS485. Si no lo ves claro, pon «No sé» y haz la foto.'}),
  F('photo','ph_recon_485','Foto de los puertos o bornes de comunicación de la reconectadora',{showIf:v=>v.reconectadora==='Sí'}),
  F('photo','ph_recon_panel','Foto del panel o display de la reconectadora (estado y alarmas)',{showIf:v=>v.reconectadora==='Sí'}),
  F('choice','alimentacion','Alimentación de la central',{options:['Monofásica','Trifásica']}),
  F('num','pot_total','Potencia total de la central (corriente alterna)',{unit:'kW'}),
  F('num','pot_contratada','Potencia contratada, si se sabe',{unit:'kW'}),

  F('num','seccion','Sección del cable de alimentación',{unit:'mm²',help:'Si no viene escrita en la funda, apúntalo en el motivo y pregunta a oficina. No se supone ningún dato.'}),

  F('choice','dimensionado','¿Comprobado el dimensionado de las protecciones del CGBT?',{options:YN}),
  F('choice','ac_aguanta','¿La alimentación en alterna aguanta lo que va a pedir el cuadro?',{options:YNN}),
  F('choice','deficiencias','Deficiencias en el CGBT',{options:['No hay','Hay'],help:'Si hay deficiencias: anótalas en Notas. Oficina avisa a Telefónica con una propuesta técnica.'}),
 ]},
 {id:'fuerza',title:'Cuadro de fuerza',intro:'Es el armario del que cuelga todo. Contiene los rectificadores y la controladora. El consumo real que midas aquí es el dato más importante.',fields:[

  F('photo','ph_cf_placa','Foto de la placa o etiqueta del fabricante y modelo'),
  F('photo','ph_cf_esq','Foto del esquema o plano pegado en el cuadro (si hay)',{}),
  F('photo','ph_rect','Foto de los rectificadores: módulos instalados y huecos libres',{}),
  F('photo','ph_ctrl','Foto de la controladora: pantalla encendida y modelo',{}),
  F('photo','ph_rect_et','Foto de la etiqueta de un rectificador, con modelo y número de serie legibles'),
  F('photo','ph_ctrl_et','Foto de la etiqueta de la controladora, con modelo y número de serie legibles'),
  F('photo','ph_barras','Foto de barras, fusibles y disyuntores con sus calibres legibles',{}),
  F('text','cf_modelo','Fabricante y modelo del cuadro',{help:'Lo pone la placa del armario.'}),
  {type:'table',id:'rect',title:'Rectificadores instalados',max:8,addLabel:'Añadir rectificador',rowName:'Rectificador',

    cols:[{k:'modelo',l:'Modelo',full:true},{k:'kw',l:'Potencia (kW)',num:true},{k:'notas',l:'Notas'}],req:['modelo','kw']},
  F('text','huecos','Huecos libres para más rectificadores',{help:'Cuenta los huecos tapados o vacíos.'}),
  F('num','i_consumo','Corriente de consumo de los equipos',{unit:'A',help:'Se lee en la controladora, tal como sale en pantalla, sin tocar el menú. Los cálculos los hace la oficina técnica.'}),
  F('num','v_salida','Tensión de salida en continua',{unit:'V',help:'Se lee en la pantalla de la controladora («TSalida»).'}),
  F('num','consumo_ti','Consumo TI (equipos de telecomunicaciones)',{unit:'kW',calcHint:'ti'}),
  F('text','ctrl_modelo','Modelo y versión de la controladora',{help:'Se ve en la pantalla o en la etiqueta.'}),
  F('choice','ctrl_litio','¿La controladora gestiona baterías de litio?',{options:YNN}),
  F('choice','descat','¿Rectificadores descatalogados o sin repuestos?',{options:YNN}),
  F('choice','carga_h','Carga de baterías configurada',{options:['10 h','20 h','No sé'],help:'Es el ajuste de la controladora. No confundir con la capacidad «a 10 h» de la etiqueta de la batería.'}),
  F('text','calibres','Calibres de fusibles y disyuntores',{}),
  F('choice','sustituir','Si hay que sustituir el cuadro entero',{options:['No hace falta','Sí, avisar'],help:'Si hay que sustituirlo, anótalo en Notas. Oficina avisa a Telefónica con un informe técnico.'}),
 ],calc:'fuerza'},

  F('text','bat_modelo','Fabricante y modelo',{}),
  F('num','bat_cap','Capacidad de una rama',{unit:'Ah',help:'La etiqueta da la capacidad «a 10 h» (C10). Apunta el valor.'}),
  {type:'table',id:'ramas',title:'Ramas de baterías',max:10,addLabel:'Añadir rama',rowName:'Rama',

  F('num','bat_temp','Temperatura de las baterías',{unit:'°C',help:'Con el termómetro, junto a los vasos.'}),
  F('num','bat_v','Tensión medida en flotación',{unit:'V',help:'Con el polímetro. Comprueba antes las puntas y el rango de continua.'}),

  F('photo','ph_vaso','Foto de un vaso con la cinta métrica al lado'),

let STEPS=STEPS_R, MODE='replanteo';

/* ============ Estado y guardado ============ */
const KEYS={replanteo:'replanteo-demo-v1',cierre:'cierre-demo-v1'}, MODEKEY='replanteo-modo';
const blankState=()=>({v:{},skip:{},tables:{rect:[],ramas:[]},notas:'',step:0,sent:false});
let S=blankState();
const PH={};            // fieldId -> [{id,blob,url}]
let memOnly=false, db=null;

function save(){if(MODE==='oficina')return;try{localStorage.setItem(KEYS[MODE],JSON.stringify(S));}catch(e){memOnly=true;}}
function load(){try{const t=localStorage.getItem(KEYS[MODE]);if(t){const o=JSON.parse(t);if(o&&o.v)S=Object.assign(S,o);}}catch(e){memOnly=true;}}

function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('replanteo-demo',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('photos',{keyPath:'id'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);
}catch(e){res(null);}});}
function idbPut(rec){return new Promise(res=>{if(!db)return res();try{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(rec);t.oncomplete=res;t.onerror=res;}catch(e){res();}});}
function idbDel(id){return new Promise(res=>{if(!db)return res();try{const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=res;t.onerror=res;}catch(e){res();}});}
function idbClear(){return new Promise(res=>{if(!db)return res();try{const t=db.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=res;t.onerror=res;}catch(e){res();}});}
function idbAll(){return new Promise(res=>{if(!db)return res([]);try{const q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}catch(e){res([]);}});}

async function loadPhotos(){
  for(const k in PH){PH[k].forEach(p=>URL.revokeObjectURL(p.url));delete PH[k];}
  const all=await idbAll();
  all.sort((a,b)=>a.t-b.t).forEach(r=>{(PH[r.field]=PH[r.field]||[]).push({id:r.id,blob:r.blob,url:URL.createObjectURL(r.blob)});});
}
async function addPhoto(field,blob){
  const id=field+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  await idbPut({id,field,blob,t:Date.now()});
  (PH[field]=PH[field]||[]).push({id,blob,url:URL.createObjectURL(blob)});
}
async function removePhoto(field,id){
  await idbDel(id);
  PH[field]=(PH[field]||[]).filter(p=>{if(p.id===id)URL.revokeObjectURL(p.url);return p.id!==id;});
}
async function compress(file){
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.72));
  }catch(e){return file;}
}

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>{const n=parseFloat(String(x==null?'':x).replace(',','.'));return isFinite(n)?n:null;};
const fmt=(n,d)=>n==null?'—':n.toLocaleString('es-ES',{maximumFractionDigits:d==null?2:d});
const allFields=()=>{const a=[];STEPS.forEach((s,i)=>(s.fields||[]).forEach(f=>a.push(Object.assign({},f,{stepIdx:i}))));return a;};
const visible=f=>!f.showIf||f.showIf(S.v);
const hasVal=v=>v!=null&&String(v).trim()!=='';

function tableOK(t){
  const rows=S.tables[t.id]||[];
  if(!rows.length)return false;
  return rows.every(r=>t.req.every(k=>hasVal(r[k])));
}
function resolved(f){
  if(f.type==='h')return true;
  if(!f.noSkip&&S.skip[f.id]!==undefined)return hasVal(S.skip[f.id]);
  if(f.type==='table')return tableOK(f);
  if(f.type==='photo')return (PH[f.id]||[]).length>0;
  return hasVal(S.v[f.id]);
}
function fieldsOf(step){return (step.fields||[]).filter(f=>f.type==='h'||f.type==='table'||visible(f));}
function stepStats(step){
  const fs=fieldsOf(step).filter(f=>f.type!=='h');
  const done=fs.filter(resolved).length;return {done,total:fs.length};
}
function pendingList(){
  const out=[];
  STEPS.forEach((s,i)=>{if(s.review)return;fieldsOf(s).forEach(f=>{if(f.type!=='h'&&!resolved(f))out.push({i,f});});});
  return out;
}

/* ============ Cálculos ============ */
function calc(){
  const rect=S.tables.rect||[],ramas=S.tables.ramas||[];
  const nRect=rect.filter(r=>hasVal(r.modelo)).length;
  const capRect=rect.reduce((a,r)=>a+(num(r.kw)||0),0);
  const ti=(num(S.v.i_consumo)!=null&&num(S.v.v_salida)!=null)?num(S.v.i_consumo)*num(S.v.v_salida)/1000:null;
  const bancs=new Set(ramas.filter(r=>hasVal(r.banc)).map(r=>String(r.banc).trim()));
  const nRamas=ramas.filter(r=>hasVal(r.vasos)).length;
  const peso=ramas.reduce((a,r)=>a+(num(r.vasos)||0)*(num(r.peso)||0),0);
  const anio=num(S.v.anio_fab);
  const antig=anio?new Date().getFullYear()-anio:null;
  return {nRect,capRect,ti,nBanc:bancs.size,nRamas,peso,antig};
}
function avisosC(){
  const a=[],v=S.v;
  if(v.d_aplica==='Sí'&&num(v.d_pb)===0)a.push('Peso de plomo retirado = 0 kg con retirada marcada: comprobar con el ticket de báscula.');
  if(v.f_carga==='20 h')a.push('Carga a 20 h: notificar a Telefónica.');
  if(v.c_bat==='Litio'&&v.f_tec==='Plomo')a.push('Se instala litio pero la configuración marcada es de plomo: revisar.');
  if(v.c_bat==='Plomo'&&v.f_tec==='Litio')a.push('Se instala plomo pero la configuración marcada es de litio: revisar.');
  Object.keys(S.skip).forEach(k=>{const f=allFields().find(x=>x.id===k);if(f&&f.type!=='photo'&&hasVal(S.skip[k])&&/^(u_|m_valida|m_alarma)/.test(k))a.push('«'+f.label+'» no se pudo: '+S.skip[k]+' (el pliego exige sin trabajos pendientes).');});
  return a;
}
function avisos(){
  if(MODE==='cierre')return avisosC();
  const a=[],v=S.v;
  if(v.deficiencias==='Hay')a.push('Deficiencias en el CGBT: avisar a Telefónica con propuesta técnica.');
  if(v.ac_aguanta==='No')a.push('La alimentación en alterna no aguanta lo que pedirá el cuadro: avisar a Telefónica.');
  if(v.descat==='Sí')a.push('Rectificadores descatalogados o sin repuestos: avisar.');
  if(v.sustituir==='Sí, avisar')a.push('Hay que sustituir el cuadro de fuerza: informe técnico a Telefónica.');
  if(v.ctrl_litio==='No')a.push('La controladora no gestiona litio: si va litio, cambiarla o instalar una controladora de baterías.');
  if(v.carga_h==='20 h')a.push('Carga de baterías a 20 h: notificar a Telefónica.');
  if(hasVal(v.bat_def)&&!/^(ninguno|sin defectos|no hay|no)\.?$/i.test(String(v.bat_def).trim()))a.push('Defectos en baterías: '+v.bat_def+'.');
  if(v.reconectadora==='Sí')a.push('Hay reconectadora de alterna en el CGBT: dato pedido por INELCOM.');
  if(v.reconectadora==='No')a.push('No hay reconectadora de alterna en el CGBT: Telefónica quiere que funcionen todas; puede que haya que instalar una (comprarla). Decide la oficina.');
  if(v.reconectadora==='Sí'){const m=[];if(v.recon_func==='No')m.push('no funciona');if(v.recon_alarma==='No')m.push('sin alarma');if(v.recon_485==='No')m.push('sin RS485');if(m.length)a.push('La reconectadora no cumple ('+m.join(', ')+'): puede que haya que sustituirla, es decir, comprar una nueva. Decide la oficina.');}
  if(v.bat_tec==='Litio'&&(S.tables.ramas||[]).length)a.push('Hay litio: no se mezclan tecnologías en el mismo sistema sin validación de Telefónica.');
  return a;
}

/* ============ Pintado ============ */
function chips(){
  $('#chips').innerHTML=STEPS.map((s,i)=>{
    let cls='chip',num='';
    if(!s.review){const st=stepStats(s);if(st.total&&st.done===st.total)cls+=' done';num='<span class="n">'+st.done+'/'+st.total+'</span>';}
    return '<button class="'+cls+'" data-go="'+i+'"'+(i===S.step?' aria-current="step"':'')+'>'+esc(s.review?'Enviar':s.title.replace(/ \(.*\)/,''))+num+'</button>';
  }).join('');
}
function header(){
  document.body.classList.toggle('office',MODE==='oficina');
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===MODE));
  if(MODE==='oficina'){$('#h1').textContent='Oficina';$('#cname').textContent='';return;}
  let total=0,done=0;
  STEPS.forEach(s=>{if(s.review)return;const st=stepStats(s);total+=st.total;done+=st.done;});
  const pct=total?Math.round(done/total*100):0;
  $('#barfill').style.width=pct+'%';
  $('#progtxt').textContent=done+' de '+total+' puntos resueltos';
  $('#progpend').textContent=(total-done)+' pendientes';
  $('#cname').textContent=S.v.nombre||'Central sin nombre';
  $('#h1').textContent=MODE==='cierre'?'Cierre de central':'Replanteo de central';
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===MODE));
  chips();
}
function help(f){return f.help?'<details class="help"><summary>¿Cómo se rellena?</summary><p>'+esc(f.help)+'</p></details>':'';}
function refTag(f){return f.ref?'<span class="ref">'+esc(f.ref)+'</span>':'';}
function skipUI(f){
  if(f.noSkip)return '<div class="hint">Obligatorio: no se puede marcar como «no se pudo».</div>';
  if(S.skip[f.id]!==undefined){
    return '<div class="skipbox"><div class="t">No se pudo / no aplica. Escribe el motivo:</div>'+
      '<input type="text" data-skipreason="'+f.id+'" value="'+esc(S.skip[f.id])+'" placeholder="Ej.: no tengo el equipo, no se ve, no hay…">'+
      '<button class="skip" data-unskip="'+f.id+'">Quitar y rellenar</button></div>';
  }
  return '<button class="skip" data-skip="'+f.id+'">No se pudo / no aplica</button>';
}
function cardCls(f){return 'card'+(S.skip[f.id]!==undefined?' skipped':'')+(resolved(f)&&S.skip[f.id]===undefined?' done':'');}

function fieldHTML(f){
  if(f.type==='h')return '<h3 class="sub">'+esc(f.text)+'</h3>';
  if(f.type==='table')return tableHTML(f);
  const sk=!f.noSkip&&S.skip[f.id]!==undefined;
  let body='';
  if(!sk){
    if(f.type==='choice'){
      body='<div class="choices">'+f.options.map(o=>'<button class="choice" data-pick="'+f.id+'" data-val="'+esc(o)+'" aria-pressed="'+(S.v[f.id]===o)+'">'+esc(o)+'</button>').join('')+'</div>';
    }else if(f.type==='photo'){
      const ph=PH[f.id]||[];
      body='<div class="thumbs">'+ph.map(p=>'<div class="th"><img src="'+p.url+'" alt="Foto"><button data-delph="'+f.id+'" data-phid="'+p.id+'" aria-label="Borrar foto">×</button></div>').join('')+'</div>'+
        '<div class="inp"><label class="btn sm addph" for="file_'+f.id+'">📷 '+(ph.length?'Añadir otra foto':'Hacer o elegir foto')+'</label>'+
        '<input id="file_'+f.id+'" type="file" accept="image/*" capture="environment" multiple data-file="'+f.id+'"></div>';
    }else if(f.type==='long'){
      body='<div class="inp"><textarea id="in_'+f.id+'" data-in="'+f.id+'">'+esc(S.v[f.id]||'')+'</textarea></div>';
    }else if(f.type==='date'){
      body='<div class="inp"><input id="in_'+f.id+'" type="date" data-in="'+f.id+'" value="'+esc(S.v[f.id]||'')+'"></div>';
    }else{
      const m=(f.type==='num'||f.type==='year')?' inputmode="decimal"':'';
      body='<div class="inp"><input id="in_'+f.id+'" type="text"'+m+' data-in="'+f.id+'" value="'+esc(S.v[f.id]||'')+'" autocomplete="off">'+(f.unit?'<span class="unit">'+esc(f.unit)+'</span>':'')+'</div>';
      if(f.calcHint==='ti')body+='<div class="hint" id="hint_ti"></div>';
    }
  }
  return '<div class="'+cardCls(f)+'" data-card="'+f.id+'"><div class="lab"><label for="in_'+f.id+'">'+esc(f.label)+'</label>'+refTag(f)+'</div>'+help(f)+body+skipUI(f)+'</div>';
}
function tableHTML(t){
  const sk=S.skip[t.id]!==undefined;
  const rows=S.tables[t.id]||[];
  let body='';
  if(!sk){
    body='<div class="tbl">'+rows.map((r,ri)=>'<div class="row"><div class="rt"><span>'+esc(t.rowName)+' '+(ri+1)+'</span><button class="rm" data-rmrow="'+t.id+'" data-ri="'+ri+'">Quitar</button></div><div class="grid">'+
      t.cols.map(c=>{
        const id='t_'+t.id+'_'+ri+'_'+c.k;
        let inp;
        if(c.sel)inp='<select id="'+id+'" data-tin="'+t.id+'" data-ri="'+ri+'" data-k="'+c.k+'">'+c.sel.map(o=>'<option'+(r[c.k]===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
        else inp='<input id="'+id+'" type="text"'+(c.num?' inputmode="decimal"':'')+' data-tin="'+t.id+'" data-ri="'+ri+'" data-k="'+c.k+'" value="'+esc(r[c.k]||'')+'" autocomplete="off">';
        return '<div'+(c.full?' class="full"':'')+'><label for="'+id+'">'+esc(c.l)+(t.req.includes(c.k)?' *':'')+'</label>'+inp+'</div>';
      }).join('')+'</div></div>').join('')+'</div>'+
      (rows.length<t.max?'<div class="inp"><button class="btn sm" data-addrow="'+t.id+'">+ '+esc(t.addLabel)+'</button></div>':'');
  }
  return '<div class="'+cardCls(t)+'" data-card="'+t.id+'"><div class="lab"><span>'+esc(t.title)+'</span></div>'+help(t)+
    (sk?'':'<div class="hint">Los campos con * son obligatorios.</div>')+body+skipUI(t)+'</div>';
}
function calcBox(kind){
  const c=calc();
  if(kind==='fuerza')return '<div class="calc" id="calcbox"><div class="t">Calculado (la oficina lo comprueba)</div><div><span>Nº de rectificadores</span><b>'+c.nRect+'</b></div><div><span>Capacidad total de los rectificadores</span><b>'+fmt(c.capRect)+' kW</b></div></div>';
  if(kind==='baterias')return '<div class="calc" id="calcbox"><div class="t">Calculado (la oficina lo comprueba)</div><div><span>Nº de bancadas</span><b>'+c.nBanc+'</b></div><div><span>Nº de ramas</span><b>'+c.nRamas+'</b></div><div><span>Peso de los vasos, sin bancada</span><b>'+fmt(c.peso,0)+' kg</b></div><div><span>Antigüedad de las baterías</span><b>'+(c.antig==null?'—':c.antig+' años')+'</b></div></div>';
  return '';
}
function refreshLive(){
  const cb=$('#calcbox');
  if(cb){const k=STEPS[S.step].calc;cb.outerHTML=calcBox(k);}
  const h=$('#hint_ti');
  if(h){const c=calc();h.textContent=c.ti==null?'':'Con corriente × tensión sale ≈ '+fmt(c.ti,1)+' kW. Compruébalo con lo que lees en la controladora.';}
  STEPS[S.step].fields&&fieldsOf(STEPS[S.step]).forEach(f=>{
    if(f.type==='h')return;
    const el=document.querySelector('[data-card="'+f.id+'"]');
    if(el)el.className=cardCls(f);
  });
  header();
}

function render(keepScroll){
  if(MODE==='oficina')return renderOffice();
  const y=keepScroll?window.scrollY:0;
  const s=STEPS[S.step];
  let h='';
  if(S.step===0&&memOnly){
    h+='<div class="demo">Este navegador no permite guardar: si cierras la página se pierde lo escrito.</div>';
  }
  if(s.review){h+=reviewHTML();}
  else{
    h+='<h2>'+esc(s.title)+'</h2><p class="intro">'+esc(s.intro)+'</p>';
    if(s.calc)h+=calcBox(s.calc);
    h+=fieldsOf(s).map(fieldHTML).join('');
  }
  $('#main').innerHTML=h;
  $('#prev').disabled=S.step===0;
  $('#next').textContent=S.step===STEPS.length-2?'Revisar →':'Siguiente →';
  $('#next').style.display=s.review?'none':'';
  header();refreshLive();
  window.scrollTo(0,y);
}

    h+='<div class="okbox"><b>Envío simulado.</b> En esta versión de prueba no se ha enviado nada. En la versión real, esto llegaría a la oficina técnica con las fotos de la central <b>'+esc(S.v.nombre||'')+'</b>.</div>';

/* ============ Resumen y Excel ============ */
function valueOf(f){
  if(f.type==='table'){
    if(S.skip[f.id]!==undefined)return {v:'',state:'No se pudo',why:S.skip[f.id]};
    return {v:(S.tables[f.id]||[]).length+' filas',state:tableOK(f)?'Hecho':'Pendiente',why:''};
  }
  if(S.skip[f.id]!==undefined)return {v:'',state:'No se pudo',why:S.skip[f.id]};
  if(f.type==='photo')return {v:(PH[f.id]||[]).length+' foto(s)',state:(PH[f.id]||[]).length?'Hecha':'Pendiente',why:''};
  return {v:S.v[f.id]||'',state:hasVal(S.v[f.id])?'Hecho':'Pendiente',why:''};
}
function rowsForExport(){
  const out=[['Sección','Campo','Valor','Estado','Motivo','Ref. pliego']];
  STEPS.forEach(s=>{if(s.review)return;fieldsOf(s).forEach(f=>{
    if(f.type==='h')return;
    const x=valueOf(f);out.push([s.title,f.label||f.title,x.v,x.state,x.why,f.ref||'']);
  });});
  return out;
}
function summaryText(){
  const lines=[(MODE==='cierre'?'CIERRE DE CENTRAL: ':'REPLANTEO DE CENTRAL: ')+(S.v.nombre||'(sin nombre)'),'Fecha: '+(S.v.fecha||'')+'  ·  Visita: '+(S.v.quien||'')+'  ·  BTP: '+(S.v.btp||''),''];
  rowsForExport().slice(1).forEach(r=>lines.push(r[0]+' · '+r[1]+': '+(r[3]==='No se pudo'?'NO SE PUDO ('+r[4]+')':r[2])));
  const av=avisos();if(av.length){lines.push('','AVISOS:');av.forEach(a=>lines.push('- '+a));}
  if(S.notas)lines.push('','NOTAS: '+S.notas);
  return lines.join('\n');
}

function templateCells(){
  const out={},c=calc();
  allFields().forEach(f=>{
    const m=CELL[f.id];if(!m)return;
    const hidden=f.showIf&&!f.showIf(S.v);if(hidden)return;
    let val;
    if(S.skip[f.id]!==undefined){val=f.type==='photo'?'No se pudo':(S.skip[f.id]||'No se pudo');}
    else if(f.type==='photo'){val=(PH[f.id]||[]).length?'Hecha':'';}

      val=String(S.v[f.id]).trim();
      if(f.id==='fecha')val=fechaES(val);

      else if(m[1]&&num(val)!=null&&/^[\d.,\s]+$/.test(val))val=val+m[1];
    }
    if(val!=='')out[m[0]]=val;
  });
  (S.tables.rect||[]).slice(0,8).forEach((r,i)=>{const n=76+i;
    if(r.modelo)out['D'+n]=r.modelo;if(hasVal(r.kw))out['I'+n]=String(r.kw).trim();if(r.notas)out['K'+n]=r.notas;});
  if(S.skip.rect!==undefined&&hasVal(S.skip.rect))out['D76']=S.skip.rect;
  (S.tables.ramas||[]).slice(0,10).forEach((r,i)=>{const n=104+i;
    if(hasVal(r.banc))out['C'+n]=String(r.banc).trim();if(hasVal(r.vasos))out['D'+n]=String(r.vasos).trim();if(r.medidas)out['E'+n]=r.medidas;

  if(S.skip.ramas!==undefined&&hasVal(S.skip.ramas))out['D104']=S.skip.ramas;
  if((S.tables.rect||[]).length)out['G84']=String(c.nRect);
  if(c.capRect)out['K88']=fmt(c.capRect)+' kW';
  if((S.tables.ramas||[]).length){out['H114']=String(c.nBanc);out['H115']=String(c.nRamas);out['H116']=fmt(c.peso,0)+' kg';}

  if(S.v.reconectadora==='Sí'){const rv=[S.v.recon_func,S.v.recon_alarma,S.v.recon_485];out['K172']=rv.includes('No')?'No cumple':(rv.every(x=>x==='Sí')?'Cumple':'Por confirmar');}
  const av=avisos(),notas=[];
  if(S.notas)notas.push(S.notas);
  if(av.length)notas.push('AVISOS PARA LA OFICINA: '+av.join(' | '));
  if(notas.length)out['B163']=notas.join('\n');
  return out;
}
function fillSheetXML(xml,cells){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const ns=doc.documentElement.namespaceURI;
  const all={};doc.querySelectorAll('c').forEach(c=>{all[c.getAttribute('r')]=c;});
  const missing=[];
  Object.keys(cells).forEach(addr=>{
    const c=all[addr];if(!c){missing.push(addr);return;}
    while(c.firstChild)c.removeChild(c.firstChild);
    c.setAttribute('t','inlineStr');
    const is=doc.createElementNS(ns,'is'),t=doc.createElementNS(ns,'t');
    t.setAttribute('xml:space','preserve');t.textContent=cells[addr];
    is.appendChild(t);c.appendChild(is);
  });
  return {xml:new XMLSerializer().serializeToString(doc),missing};
}

  const cols=[];[...sh.getElementsByTagName('col')].forEach(c=>{for(let i=+c.getAttribute('min');i<=+c.getAttribute('max');i++)cols[i]=+c.getAttribute('width');});
  const fr=sh.getElementsByTagName('sheetFormatPr')[0];
  const defRow=fr&&fr.getAttribute('defaultRowHeight')?+fr.getAttribute('defaultRowHeight'):15;
  const defCol=fr&&fr.getAttribute('defaultColWidth')?+fr.getAttribute('defaultColWidth'):9.14;
  const rows={},cells={};let maxR=0,maxC=0;
  [...sh.getElementsByTagName('row')].forEach(r=>{const n=+r.getAttribute('r');rows[n]=r.getAttribute('ht')?+r.getAttribute('ht'):defRow;maxR=Math.max(maxR,n);});
  [...sh.getElementsByTagName('c')].forEach(c=>{
    const a=c.getAttribute('r'),p=colNum(a),t=c.getAttribute('t');let v='';
    if(t==='s'){const vv=c.getElementsByTagName('v')[0];v=vv?(sst[+vv.textContent]||''):'';}
    else if(t==='inlineStr'){v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');}
    else{const vv=c.getElementsByTagName('v')[0];v=vv?vv.textContent:'';}
    const xf=xfs[+(c.getAttribute('s')||0)]||xfs[0];
    if(v!==''&&xf.fmt&&/^General"(.*)"$/.test(xf.fmt)&&t!=='s'&&t!=='inlineStr'&&t!=='str')v=v+xf.fmt.replace(/^General"(.*)"$/,'$1');
    cells[a]={c:p.c,r:p.r,v,xf};maxR=Math.max(maxR,p.r);maxC=Math.max(maxC,p.c);
  });
  const merges=[...sh.getElementsByTagName('mergeCell')].map(m=>{const [a,b]=m.getAttribute('ref').split(':');const s=colNum(a),e=colNum(b);return {c1:s.c,r1:s.r,c2:e.c,r2:e.r};});
  /* logo */
  let logo=null;
  try{
    const dx=await txt('xl/drawings/drawing1.xml'),img=z.file('xl/media/image1.png');
    if(dx&&img){const d=xdoc(dx),fromE=d.getElementsByTagName('xdr:from')[0],ext=d.getElementsByTagName('xdr:ext')[0];
      const g=(n,t)=>+fromE.getElementsByTagName('xdr:'+t)[0].textContent;
      logo={data:'data:image/png;base64,'+await img.async('base64'),col:g(fromE,'col'),colOff:g(fromE,'colOff'),row:g(fromE,'row'),rowOff:g(fromE,'rowOff'),cx:+ext.getAttribute('cx'),cy:+ext.getAttribute('cy')};}
  }catch(e){logo=null;}
  return {cols,defCol,rows,cells,merges,maxR,maxC,logo};
}
function photoTitle(name){
  const b=name.replace(/^.*\//,'').replace(/\.[^.]+$/,'');
  const m=/^(\d+)_(.*?)(?:_(\d+))?$/.exec(b);
  if(!m)return b.replace(/_/g,' ');
  return m[1]+' · '+m[2].replace(/_/g,' ')+(m[3]&&m[3]!=='1'?' ('+m[3]+')':'');
}
async function readZipPhotos(buf){
  const z=await window.JSZip.loadAsync(buf);
  const names=Object.keys(z.files).filter(n=>!z.files[n].dir&&IMG_RE.test(n)&&!/__MACOSX/.test(n)).sort((a,b)=>a.replace(/^.*\//,'').localeCompare(b.replace(/^.*\//,'')));
  const out=[];
  for(const n of names)out.push({name:n,title:photoTitle(n),blob:await z.files[n].async('blob')});
  return out;
}
async function blobToJpeg(blob){
  const bmp=await createImageBitmap(blob);
  const sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return {data:c.toDataURL('image/jpeg',0.8),w:c.width,h:c.height};
}
const hex=h=>[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
async function buildPdf(){
  await ensureLibs();
  const sh=OF.sheet,{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const PW=297,PH=210,M=10,PT=0.352778,PX=0.264583;
  const maxC=Math.max(sh.maxC,14);
  const cw=[];for(let c=1;c<=maxC;c++){const w=sh.cols[c]!=null?sh.cols[c]:sh.defCol;cw[c]=(w*7+5)*PX;}
  const total=cw.slice(1).reduce((a,b)=>a+b,0),k=Math.min(1,(PW-2*M)/total);
  const x0=M+((PW-2*M)-total*k)/2;
  const cx=[];cx[1]=x0;for(let c=2;c<=maxC+1;c++)cx[c]=cx[c-1]+cw[c-1]*k;
  const mergeAt={},covered={};
  sh.merges.forEach(m=>{mergeAt[m.c1+','+m.r1]=m;for(let r=m.r1;r<=m.r2;r++)for(let c=m.c1;c<=m.c2;c++)if(!(r===m.r1&&c===m.c1))covered[c+','+r]=1;});
  const width=(c1,c2)=>cx[c2+1]-cx[c1];
  const style=(cell)=>{const f=cell.xf.font;doc.setFont('helvetica',f.b&&f.i?'bolditalic':f.b?'bold':f.i?'italic':'normal');doc.setFontSize(f.sz*k);};
  /* altura de cada fila (crece si el texto no cabe) */
  const rh=[];
  for(let r=1;r<=sh.maxR;r++)rh[r]=(sh.rows[r]!=null?sh.rows[r]:15)*PT*k;
  Object.values(sh.cells).forEach(cell=>{
    if(!cell.v||!cell.xf.wrap||covered[cell.c+','+cell.r])return;
    const m=mergeAt[cell.c+','+cell.r];if(m&&m.r2>m.r1)return;
    const w=(m?width(m.c1,m.c2):cw[cell.c]*k)-3;style(cell);
    const lines=doc.splitTextToSize(pdfTxt(cell.v),w).length;
    const need=lines*cell.xf.font.sz*k*1.18*PT+2.2;
    if(need>rh[cell.r])rh[cell.r]=need;
  });
  /* bloques de filas unidos por combinaciones verticales */
  const blocks=[];let r=1;
  while(r<=sh.maxR){let end=r;
    for(let again=true;again;){again=false;sh.merges.forEach(m=>{if(m.r2>m.r1&&m.r1<=end&&m.r2>end){end=m.r2;again=true;}});}
    blocks.push({r1:r,r2:end,h:rh.slice(r,end+1).reduce((a,b)=>a+b,0)});r=end+1;}
  const pages=[];let cur=[],y=M;
  const isHead=b=>{const c=sh.cells['B'+b.r1];return !!(c&&c.xf.fill==='002060'&&b.r1>2);};
  blocks.forEach((b,i)=>{
    let need=b.h;if(isHead(b)){for(let j=1;j<=4;j++)need+=(blocks[i+j]?blocks[i+j].h:0);}
    if(y+need>PH-M-4&&cur.length){pages.push(cur);cur=[];y=M;}b.y=y;cur.push(b);y+=b.h;});
  if(cur.length)pages.push(cur);
  const byRow={};Object.values(sh.cells).forEach(c=>{(byRow[c.r]=byRow[c.r]||[]).push(c);});
  const drawCell=(cell,x,yy,w,h)=>{
    const xf=cell.xf;
    if(xf.fill){doc.setFillColor(...hex(xf.fill));doc.rect(x,yy,w,h,'F');}
    doc.setLineWidth(0.12);
    [['left',x,yy,x,yy+h],['right',x+w,yy,x+w,yy+h],['top',x,yy,x+w,yy],['bottom',x,yy+h,x+w,yy+h]].forEach(([s,a,b,c2,d])=>{
      if(xf.border[s]){doc.setDrawColor(...hex(xf.border[s]));doc.line(a,b,c2,d);}});
    if(!cell.v)return;
    const f=xf.font;style(cell);doc.setTextColor(...hex(f.color));
    const ind=xf.indent*1.6,pad=1.2,tw=w-2*pad-ind;
    const lines=xf.wrap?doc.splitTextToSize(pdfTxt(cell.v),tw):[pdfTxt(cell.v)];
    const lh=f.sz*k*1.18*PT,tot=lines.length*lh;
    const y0=xf.v==='top'?yy+0.9:xf.v==='center'?yy+(h-tot)/2:yy+h-tot-0.9;
    const isNum=/^-?[\d.,]+$/.test(cell.v);
    const hz=xf.h==='center'||xf.h==='right'?xf.h:(xf.h==='left'||!xf.h)&&!isNum?'left':(isNum?'right':'left');
    const tx=hz==='center'?x+w/2:hz==='right'?x+w-pad:x+pad+ind;
    doc.saveGraphicsState();doc.rect(x,yy,w,h);doc.clip();doc.discardPath();
    lines.forEach((ln,i)=>doc.text(ln,tx,y0+i*lh,{align:hz,baseline:'top'}));
    doc.restoreGraphicsState();
  };
  pages.forEach((pg,pi)=>{
    if(pi>0)doc.addPage();
    pg.forEach(b=>{let yy=b.y;
      for(let rr=b.r1;rr<=b.r2;rr++){
        (byRow[rr]||[]).forEach(cell=>{
          if(covered[cell.c+','+rr])return;
          const m=mergeAt[cell.c+','+rr];
          const w=m?width(m.c1,m.c2):cw[cell.c]*k;
          const h=m?rh.slice(m.r1,m.r2+1).reduce((a,b2)=>a+b2,0):rh[rr];
          drawCell(cell,cx[cell.c],yy,w,h);
        });
        yy+=rh[rr];
      }});
    if(pi===0&&sh.logo){const L=sh.logo;
      try{doc.addImage(L.data,'PNG',cx[L.col+1]+L.colOff/36000*k,M+L.rowOff/36000*k,L.cx/36000*k,L.cy/36000*k);}catch(e){}}
  });
  /* anexo de fotos */
  const nombre=(sh.cells.G10&&sh.cells.G10.v)||'';
  const jpgs=[];
  for(const p of OF.photos){try{const j=await blobToJpeg(p.blob);jpgs.push(Object.assign({title:p.title},j));}catch(e){jpgs.push({title:p.title,fail:true});}}
  const GX=[M,PW/2+2],GW=PW/2-M-2,GH=(PH-2*M-14)/2-8;
  jpgs.forEach((p,i)=>{
    if(i%4===0){doc.addPage();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(0,32,96);
      doc.text(pdfTxt('Anexo de fotos'+(nombre?' - '+nombre:'')),M,M+4);}
    const col=i%2,row=Math.floor((i%4)/2);
    const gx=GX[col],gy=M+10+row*(GH+14);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(40,40,40);
    doc.text(pdfTxt(p.title),gx,gy+3,{baseline:'alphabetic'});
    if(p.fail){doc.setFont('helvetica','italic');doc.setFontSize(9);doc.text('(No se pudo leer esta foto)',gx,gy+10);return;}
    const sc=Math.min(GW/p.w,GH/p.h),w=p.w*sc,h=p.h*sc;
    doc.addImage(p.data,'JPEG',gx,gy+5,w,h);
    doc.setDrawColor(159,180,204);doc.setLineWidth(0.15);doc.rect(gx,gy+5,w,h);
  });
  /* pie de página */
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(127,127,127);
    doc.text(pdfTxt((nombre||'Replanteo')+'  ·  página '+i+' de '+n),PW-M,PH-5,{align:'right'});}
  return doc.output('blob');
}

  let h='<h2>Oficina</h2><p class="intro">Sube el Excel y el ZIP de fotos que manda el técnico. Se genera un PDF con la hoja de Replanteo tal cual y, a continuación, las fotos con su título. Los archivos no salen de este navegador.</p>';

     '<div class="inp"><label class="btn sm addph" for="off_x">📄 '+(ok?'Cambiar Excel':'Elegir Excel')+'</label><input id="off_x" type="file" accept=".xlsx" data-off="x"></div>'+
     (ok?'<div class="hint">'+esc(OF.xname)+(name?' · central: <b>'+esc(name)+'</b>':'')+'</div>':'')+'</div>';

     '<div class="inp"><label class="btn sm addph" for="off_z">🖼️ '+(OF.photos.length?'Cambiar ZIP':'Elegir ZIP')+'</label><input id="off_z" type="file" accept=".zip" data-off="z"></div>'+
     (OF.zname?'<div class="hint">'+esc(OF.zname)+' · '+OF.photos.length+' foto(s)</div>':'<div class="hint">Opcional: sin ZIP, el PDF sale solo con la hoja.</div>')+'</div>';

async function officeFile(el){
  const f=el.files&&el.files[0];el.value='';if(!f)return;

    await ensureLibs();

async function officePdf(){
  const m=$('#offmsg'),b=$('#mkpdf');if(b)b.disabled=true;if(m)m.textContent='Generando PDF…';

    const nm=(OF.sheet.cells.G10&&OF.sheet.cells.G10.v||'central').replace(/[^\w\-]+/g,'_');

  }catch(e){OF.msg=e&&e.code==='declined'?'Descarga cancelada.':'No se pudo generar el PDF: '+(e.message||e.code||'error')+'.';}

}

/* ============ Eventos ============ */
async function switchMode(m){
  if(m===MODE)return;
  if(m==='oficina'){save();MODE='oficina';render();return;}
  save();const keep={nombre:S.v.nombre,fecha:S.v.fecha,quien:S.v.quien,btp:S.v.btp};
  MODE=m;STEPS=m==='cierre'?STEPS_C:STEPS_R;S=blankState();load();
  Object.keys(keep).forEach(k=>{if(!hasVal(S.v[k])&&hasVal(keep[k]))S.v[k]=keep[k];});
  if(!S.v.fecha)S.v.fecha=new Date().toISOString().slice(0,10);
  S.step=Math.min(S.step||0,STEPS.length-1);
  try{localStorage.setItem(MODEKEY,m);}catch(e){}
  save();render();window.scrollTo(0,0);
}
function go(i,scrollTo){S.step=Math.max(0,Math.min(STEPS.length-1,i));save();render();
  if(scrollTo){const el=document.querySelector('[data-card="'+scrollTo+'"]');if(el)el.scrollIntoView({block:'center'});}else window.scrollTo(0,0);}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,label');if(!t)return;
  const d=t.dataset||{};
  if(d.mode)return switchMode(d.mode);
  if(d.go!==undefined)return go(+d.go);
  if(t.id==='prev')return go(S.step-1);
  if(t.id==='next')return go(S.step+1);
  if(d.pick){const cur=S.v[d.pick];S.v[d.pick]=(cur===d.val)?'':d.val;save();return render(true);}
  if(d.skip){S.skip[d.skip]='';save();render(true);const i=document.querySelector('[data-skipreason="'+d.skip+'"]');if(i)i.focus();return;}
  if(d.unskip){delete S.skip[d.unskip];save();return render(true);}
  if(d.delph){await removePhoto(d.delph,d.phid);return render(true);}
  if(d.addrow){const t0=allFields().find(f=>f.id===d.addrow)||null;(S.tables[d.addrow]=S.tables[d.addrow]||[]).push({});save();return render(true);}
  if(d.rmrow){S.tables[d.rmrow].splice(+d.ri,1);save();return render(true);}
  if(d.jump!==undefined)return go(+d.jump,d.field);
  if(t.id==='loadEx'){t.disabled=true;t.textContent='Cargando…';return loadExample();}
  if(t.id==='reset'){if(t.dataset.sure){return resetAll();}t.dataset.sure='1';t.textContent='¿Seguro? Pulsa otra vez para borrar todo';return;}
  if(t.id==='newc'){
    const back=()=>{delete t.dataset.sure;t.classList.remove('sure');t.textContent='＋ Nueva central';};
    if(t.dataset.sure){back();window.scrollTo(0,0);return resetAll();}
    t.dataset.sure='1';t.classList.add('sure');t.textContent='¿Borrar todo, fotos incluidas? Pulsa otra vez';
    setTimeout(()=>{if(t.dataset.sure)back();},5000);return;
  }
  if(t.id==='send'){if(!pendingList().length){S.sent=true;save();render(true);}return;}
  if(t.id==='dlx')return doExcel();
  if(t.id==='dlz')return doZip();
  if(t.id==='cp')return doCopy();
  if(t.id==='sh')return doShare();
  if(t.id==='mkpdf')return officePdf();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.in){S.v[el.dataset.in]=el.value;save();refreshLive();}
  else if(el.dataset.skipreason){S.skip[el.dataset.skipreason]=el.value;save();refreshLive();}
  else if(el.dataset.tin){const r=S.tables[el.dataset.tin][+el.dataset.ri];r[el.dataset.k]=el.value;save();refreshLive();}
  else if(el.dataset.notas){S.notas=el.value;save();}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.off)return officeFile(el);
  if(el.dataset.file){
    const files=[...el.files];el.value='';
    for(const f of files){await addPhoto(el.dataset.file,await compress(f));}
    render(true);
  }else if(el.dataset.tin&&el.tagName==='SELECT'){
    S.tables[el.dataset.tin][+el.dataset.ri][el.dataset.k]=el.value;save();refreshLive();
  }
});
